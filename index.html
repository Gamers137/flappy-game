<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            overflow: hidden;
            border: 3px solid #000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        #background {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('https://iili.io/3jZTgsa.png');
            background-size: cover;
            z-index: 1;
        }
        
        #bird {
            position: absolute;
            width: 50px;
            height: 40px;
            background-image: url('https://iili.io/3jtGtd7.png');
            background-size: contain;
            background-repeat: no-repeat;
            left: 50px;
            top: 300px;
            z-index: 10;
            transition: transform 0.1s;
        }
        
        .pipe {
            position: absolute;
            width: 80px;
            background-color: #5cb85c;
            border: 2px solid #3e8e41;
            z-index: 5;
        }
        
        .pipe-top {
            border-radius: 10px 10px 0 0;
        }
        
        .pipe-bottom {
            border-radius: 0 0 10px 10px;
        }
        
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background-color: #8b4513;
            background-image: linear-gradient(to bottom, #8b4513, #5d2e0f);
            z-index: 20;
            border-top: 2px solid #000;
        }
        
        #score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 30;
            font-weight: bold;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        
        #start-button {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #3e8e41;
            transition: all 0.1s;
        }
        
        #start-button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #3e8e41;
        }
        
        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            color: white;
            text-shadow: 5px 5px 10px rgba(0, 0, 0, 0.8);
            z-index: 40;
            display: none;
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 40;
            width: 70%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        #game-over h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #ff4444;
        }
        
        #final-score {
            font-size: 28px;
            color: #ffcc00;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #5cb85c;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        #restart-btn:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background"></div>
        <div id="bird"></div>
        <div id="ground"></div>
        <div id="score">0</div>
        <div id="countdown"></div>
        
        <div id="start-screen">
            <h1 style="color: #ffcc00; font-size: 42px; margin-bottom: 40px;">FLAPPY BIRD</h1>
            <button id="start-button">START GAME</button>
            <p style="color: white; margin-top: 40px;">
                PC: Press UP ARROW<br>
                Mobile: Tap Screen
            </p>
        </div>
        
        <div id="game-over">
            <h2>GAME OVER!</h2>
            <p>Your score: <span id="final-score">0</span></p>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Game elements
        const bird = document.getElementById('bird');
        const gameContainer = document.getElementById('game-container');
        const ground = document.getElementById('ground');
        const scoreElement = document.getElementById('score');
        const countdownElement = document.getElementById('countdown');
        const gameOverElement = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startButton = document.getElementById('start-button');
        
        // Game variables
        let birdPosition = 300;
        let birdVelocity = 0;
        let gravity = 0.5;
        let jumpForce = -10;
        let gameRunning = false;
        let score = 0;
        let pipes = [];
        let pipeGap = 150;
        let pipeFrequency = 2000; // milliseconds
        let lastPipeTime = 0;
        let gameSpeed = 3;
        let animationFrameId;
        let countdownInterval;
        
        // Event listeners
        document.addEventListener('keydown', handleKeyDown);
        gameContainer.addEventListener('touchstart', handleTouch);
        restartBtn.addEventListener('click', restartGame);
        startButton.addEventListener('click', startGame);
        
        function handleKeyDown(e) {
            if (e.key === 'ArrowUp' && gameRunning) {
                jump();
            }
        }
        
        function handleTouch(e) {
            if (gameRunning) {
                e.preventDefault();
                jump();
            }
        }
        
        function jump() {
            birdVelocity = jumpForce;
            bird.style.transform = 'rotate(-20deg)';
            setTimeout(() => {
                bird.style.transform = 'rotate(0deg)';
            }, 200);
        }
        
        function startGame() {
            startScreen.style.display = 'none';
            countdownElement.style.display = 'block';
            
            let count = 3;
            countdownElement.textContent = count;
            
            countdownInterval = setInterval(() => {
                count--;
                countdownElement.textContent = count;
                
                if (count <= 0) {
                    clearInterval(countdownInterval);
                    countdownElement.style.display = 'none';
                    initGame();
                }
            }, 1000);
        }
        
        function initGame() {
            birdPosition = 300;
            birdVelocity = 0;
            gameRunning = true;
            score = 0;
            pipes = [];
            scoreElement.textContent = '0';
            gameOverElement.style.display = 'none';
            
            document.querySelectorAll('.pipe').forEach(pipe => pipe.remove());
            
            bird.style.top = birdPosition + 'px';
            bird.style.transform = 'rotate(0deg)';
            
            gameLoop();
        }
        
        function createPipe() {
            const minPipeHeight = 60;
            const maxPipeHeight = gameContainer.offsetHeight - pipeGap - ground.offsetHeight - minPipeHeight;
            const pipeHeight = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;
            
            const pipeTop = document.createElement('div');
            pipeTop.className = 'pipe pipe-top';
            pipeTop.style.left = gameContainer.offsetWidth + 'px';
            pipeTop.style.height = pipeHeight + 'px';
            
            const pipeBottom = document.createElement('div');
            pipeBottom.className = 'pipe pipe-bottom';
            pipeBottom.style.left = gameContainer.offsetWidth + 'px';
            pipeBottom.style.top = (pipeHeight + pipeGap) + 'px';
            pipeBottom.style.height = (gameContainer.offsetHeight - pipeHeight - pipeGap - ground.offsetHeight) + 'px';
            
            gameContainer.appendChild(pipeTop);
            gameContainer.appendChild(pipeBottom);
            
            pipes.push({
                top: pipeTop,
                bottom: pipeBottom,
                x: gameContainer.offsetWidth,
                height: pipeHeight,
                passed: false
            });
        }
        
        function updatePipes() {
            const currentTime = Date.now();
            if (currentTime - lastPipeTime > pipeFrequency) {
                createPipe();
                lastPipeTime = currentTime;
            }
            
            for (let i = pipes.length - 1; i >= 0; i--) {
                const pipe = pipes[i];
                pipe.x -= gameSpeed;
                pipe.top.style.left = pipe.x + 'px';
                pipe.bottom.style.left = pipe.x + 'px';
                
                if (!pipe.passed && pipe.x < 50 - 80) {
                    pipe.passed = true;
                    score++;
                    scoreElement.textContent = score;
                    
                    if (score % 5 === 0) {
                        gameSpeed += 0.2;
                        pipeGap = Math.max(120, pipeGap - 5);
                    }
                }
                
                if (pipe.x < -80) {
                    pipe.top.remove();
                    pipe.bottom.remove();
                    pipes.splice(i, 1);
                }
            }
        }
        
        function checkCollision() {
            // Ground collision
            if (birdPosition + 40 > gameContainer.offsetHeight - ground.offsetHeight) {
                gameOver();
                return;
            }
            
            // Ceiling collision
            if (birdPosition < 0) {
                gameOver();
                return;
            }
            
            // Pipe collisions
            const birdRect = {
                x: 50,
                y: birdPosition,
                width: 50,
                height: 40
            };
            
            for (const pipe of pipes) {
                const topPipeRect = {
                    x: pipe.x,
                    y: 0,
                    width: 80,
                    height: pipe.height
                };
                
                const bottomPipeRect = {
                    x: pipe.x,
                    y: pipe.height + pipeGap,
                    width: 80,
                    height: gameContainer.offsetHeight - pipe.height - pipeGap - ground.offsetHeight
                };
                
                if (isColliding(birdRect, topPipeRect) || isColliding(birdRect, bottomPipeRect)) {
                    gameOver();
                    return;
                }
            }
        }
        
        function isColliding(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }
        
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationFrameId);
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
        }
        
        function restartGame() {
            gameOverElement.style.display = 'none';
            startGame();
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            birdVelocity += gravity;
            birdPosition += birdVelocity;
            bird.style.top = birdPosition + 'px';
            bird.style.transform = `rotate(${Math.min(birdVelocity * 3, 90)}deg)`;
            
            updatePipes();
            checkCollision();
            
            animationFrameId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
